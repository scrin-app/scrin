[package]
name = "scrin-server"
description = "Rendezvous, relay and WebTransport gateway server for scrin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scrin-server"
path = "src/main.rs"

[lib]
name = "scrin_server"
path = "src/lib.rs"

[dependencies]
scrin-crypto.workspace = true
iroh.workspace = true
iroh-relay = { version = "1.3.0", default-features = false, features = ["server", "tls-ring", "metrics"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws", "matched-path"] }
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"] }
tower = { version = "0.5.3", features = ["util"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
anyhow.workspace = true
bytes.workspace = true
data-encoding.workspace = true
getrandom = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-rustls-acme = { version = "0.9.1", default-features = false, features = ["rustls-tls-webpki-roots"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
wtransport = { version = "0.7.2", default-features = false, features = ["ring"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
url = "2.5.8"
sha2 = "0.10.9"
time = "0.3.55"

[dev-dependencies]
scrin-net.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.29.0"

[lints]
workspace = true

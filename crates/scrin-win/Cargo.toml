[package]
name = "scrin-win"
description = "Windows capture, encode, decode, input, audio and clipboard for scrin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
default = ["opus"]
# Opus audio encoding (libopus is built from source by the -sys crate).
opus = ["dep:opus"]

[target.'cfg(windows)'.dependencies]
openh264 = "0.9.8"
# Raw option ids/structs for runtime bitrate/fps changes (same crate openh264 links).
openh264-sys2 = { version = "0.9.8", default-features = false }
opus = { version = "0.4.0", optional = true }
windows = { version = "0.62.2", features = [
	"Win32_Foundation",
	"Win32_Graphics_Direct3D",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_Dxgi",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Gdi",
	"Win32_Media_Audio",
	"Win32_Media_KernelStreaming",
	"Win32_Media_MediaFoundation",
	"Win32_Media_Multimedia",
	"Win32_Security",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_DataExchange",
	"Win32_System_LibraryLoader",
	"Win32_System_Memory",
	"Win32_System_Ole",
	"Win32_System_Threading",
	"Win32_System_Variant",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[package]
name = "scrin-ffi"
description = "UniFFI bindings of the scrin core for Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "scrin_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
scrin-crypto.workspace = true
scrin-net.workspace = true
scrin-session.workspace = true
zeroize.workspace = true
scrin-media.workspace = true
scrin-proto.workspace = true
iroh.workspace = true
bytes.workspace = true
thiserror.workspace = true
data-encoding.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
uniffi = "0.32.2"
serde.workspace = true
serde_json = "1.0.151"
# Rendezvous client (register/presence/resolve). Same stack as iroh's relay
# client: reqwest + rustls/ring, preconfigured with webpki roots so the
# platform verifier (JNI on Android) is never used.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
webpki-roots = "1.0.9"

[dev-dependencies]
# A real in-process rendezvous + relay for tests/passphrase.rs (host-only crate).
scrin-server = { path = "../scrin-server" }

# Live interop test runners (examples/win_host.rs, examples/win_controller.rs).
[target.'cfg(windows)'.dev-dependencies]
scrin-win = { path = "../scrin-win", default-features = false }
png = "0.18.1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[features]
# Builds the `uniffi-bindgen` binary that generates the Kotlin bindings (library mode).
cli = ["uniffi/cli"]

[lints]
workspace = true

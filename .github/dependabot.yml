version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Bucharest }
    open-pull-requests-limit: 10
    commit-message: { prefix: "build", include: scope }
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Bucharest }
    open-pull-requests-limit: 10
    commit-message: { prefix: "build", include: scope }
    # pnpm minimumReleaseAge applies locally too; dependabot cooldown mirrors it
    cooldown: { default-days: 1 }
    groups:
      js-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Bucharest }
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Bucharest }
    open-pull-requests-limit: 10
    commit-message: { prefix: "build", include: scope }
    groups:
      android-minor-patch:
        update-types: [minor, patch]

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Rust Exec tasks use `enabled = <Boolean>` (not onlyIf lambdas) so they are configuration-cache safe.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Written only by scripts/version.ps1 (versionCode = MAJOR*1_000_000 + MINOR*1_000 + PATCH).
scrin.versionName=0.1.0
scrin.versionCode=1000

# Rust core: "false" skips cargo-ndk and uses prebuilt jniLibs if present.
scrin.buildRust=true
# Comma-separated ABIs. Debug defaults to the phone ABI for a fast loop.
scrin.rustAbis.debug=arm64-v8a
scrin.rustAbis.release=arm64-v8a,x86_64

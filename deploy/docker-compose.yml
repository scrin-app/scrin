# scrin self-host bundle. See deploy/README.md.
#   cp deploy/.env.example deploy/.env   # set SCRIN_DOMAIN and SCRIN_ACME_CONTACT
#   docker compose -f deploy/docker-compose.yml up -d
name: scrin

services:
  scrin-server:
    image: ${SCRIN_IMAGE:-scrin-server:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SCRIN_ROLES: rendezvous,relay,gateway
      SCRIN_TLS: acme
      SCRIN_ACME_DOMAINS: ${SCRIN_DOMAIN:?set SCRIN_DOMAIN in deploy/.env}
      SCRIN_ACME_CONTACT: ${SCRIN_ACME_CONTACT:-}
      SCRIN_ACME_STAGING: ${SCRIN_ACME_STAGING:-false}
      SCRIN_RELAY_URLS: https://${SCRIN_DOMAIN}
      SCRIN_HTTP_LISTEN: 0.0.0.0:80
      SCRIN_QAD_LISTEN: 0.0.0.0:7842
      SCRIN_DB: /data/scrin.db
      SCRIN_DATA_DIR: /data
      SCRIN_GW_MAX_BPS: ${SCRIN_GW_MAX_BPS:-3000000}
      SCRIN_LOG: ${SCRIN_LOG:-info}
    ports:
      - "443:443/tcp"   # HTTPS API, iroh relay (/relay), WebSocket gateway (/v1/ws)
      - "443:443/udp"   # WebTransport gateway (/v1/gw)
      - "80:80/tcp"     # captive-portal probe (/generate_204)
      - "7842:7842/udp" # iroh QUIC address discovery
    volumes:
      - scrin-data:/data  # SQLite database + ACME account/certificates
    healthcheck:
      # distroless has no shell/curl: the binary has no probe subcommand yet, so
      # rely on restart policy + external monitoring of https://$SCRIN_DOMAIN/health.
      disable: true

  # --- accounts (optional; added by the accounts API work, ADR-0007) --------
  # api:
  #   image: ghcr.io/scrin-app/scrin-api:latest
  #   environment:
  #     DATABASE_URL: postgres://scrin:${POSTGRES_PASSWORD}@postgres:5432/scrin
  #   depends_on: [postgres]
  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_USER: scrin
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  scrin-data:
